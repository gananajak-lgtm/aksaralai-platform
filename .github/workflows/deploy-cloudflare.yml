name: Deploy Aksaralai to Cloudflare Workers
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID GitHub Actions repository secret. Configure both in Settings > Secrets and variables > Actions before deploying."
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check src/index.js
          node sw-check.mjs
      - name: Test application
        run: npm test
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify live UI release marker
        run: |
          curl --fail --silent --show-error --location --retry 4 --retry-delay 4 \
            "https://aksaralai-platform.gananajak.workers.dev/" | \
            grep -F "รุ่นหน้าจอ 2026.09.30.3" > /dev/null || \
            { echo "::error::Cloudflare deployed but the public URL did not return the new release marker. Check custom domain, zone, and Worker route."; exit 1; }

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gananajak.aksaralai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gananajak.aksaralai'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
